<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="SlowAPI">
  <title>SlowAPI</title>
  <!-- Two protocols entering, one handler leaving.
       Both colours are explicit rather than `currentColor`: Material renders a
       custom logo through an <img>, which has no access to the page's text
       colour, so an inherited fill resolves to black and disappears against the
       dark header. #767676 is the one grey that clears 4.5:1 on white AND on
       black, which is what a mark sitting on both headers needs. -->
  <path d="M3 6.5C12 6.5 11 16 20 16" stroke="#ffd400" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M3 25.5C12 25.5 11 16 20 16" stroke="#767676" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="24.6" cy="16" r="4" fill="#ffd400"/>
</svg>
