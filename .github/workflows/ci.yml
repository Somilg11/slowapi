name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are wasted minutes. Pushes to master are the
  # historical record, so those are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Decide whether the cross-platform matrix is worth running
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          set -euo pipefail
          # An unknown base (first push, force push, manual dispatch) means we
          # cannot prove the change is documentation-only, so assume it is not.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "base unknown: running everything"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE}" HEAD)
          echo "changed files:"; echo "${changed}"
          if printf '%s\n' "${changed}" | grep -qvE '^(docs/|[^/]*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only: skipping the cross-platform matrix"
          fi

  # One runner that fails fast on everything cheap to check. Nothing expensive
  # starts until this is green, so a typo costs one runner rather than eight.
  quick:
    name: Lint, types, docs, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # Without this, setup-python looks for requirements.txt, finds none,
          # and silently caches nothing on every job in the workflow.
          cache-dependency-path: pyproject.toml

      # The zero-dependency promise has to be tested before dev extras land,
      # because afterwards the environment can no longer disprove it.
      - run: pip install .
      - run: python -c "import slowapi; print(slowapi.__version__)"
      - run: python -m slowapi --version
      - name: Every declared dependency must be behind an extra
        run: |
          python - <<'EOF'
          from importlib.metadata import requires
          required = [r for r in (requires("slowapi-framework") or []) if "extra ==" not in r]
          assert not required, f"unconditional runtime dependencies: {required}"
          print("zero required runtime dependencies: confirmed")
          EOF

      - run: pip install -e ".[dev,all]"
      - run: ruff check src tests examples benchmarks scripts
      - run: ruff format --check src tests
      - run: mypy
      # Broken doc links are a slow leak nobody files an issue about.
      - run: python scripts/check_docs_links.py
      - run: pytest --cov --cov-report=xml

      # `slowapi check` analyses every route without starting a server, which is
      # what makes a broken dependency a red build instead of a rolled-back deploy.
      - name: Every example passes route validation
        run: |
          for example in examples/*/; do
            if [ -f "$example/main.py" ]; then
              (cd "$example" && python -m slowapi check main:app)
            fi
          done
      - name: A scaffolded project passes its own tests
        run: |
          python -m slowapi new smoke-svc --template api
          cd smoke-svc && python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # Everything `quick` already covered on 3.12/Linux is deliberately absent.
  # `fail-fast` stays off: the point of a matrix is to learn *which* versions
  # break, and this project has already shipped a bug that existed on four of
  # five supported versions and was invisible on the fifth.
  matrix:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          # Windows bills at 2x and is the only platform whose path handling
          # and signal semantics genuinely differ. One version is enough.
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,all]"
      - run: pytest -q

  # macOS bills at 10x. Two macOS jobs used to cost more than the rest of the
  # workflow combined, to test a pure-Python package on a platform that differs
  # from Linux in nothing this framework touches. It now runs when master moves,
  # not on every pull request.
  macos:
    name: Test 3.13 on macos
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,all]"
      - run: pytest -q

  build:
    name: Build distributions
    needs: [changes, quick, matrix]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
