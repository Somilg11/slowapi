name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples benchmarks scripts
      - run: ruff format --check src tests
      - run: mypy
      # Broken doc links are a slow leak nobody files an issue about.
      - run: python scripts/check_docs_links.py

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix affordable; the oldest and newest cover the range.
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,all]"
      - run: pytest --cov --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  zero-deps:
    name: Import with no optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The zero-dependency promise is only real if CI proves it every commit.
      - run: pip install .
      - run: python -c "import slowapi; print(slowapi.__version__)"
      - run: python -m slowapi --version
      - name: Every declared dependency must be behind an extra
        run: |
          python - <<'EOF'
          from importlib.metadata import requires
          required = [r for r in (requires("slowapi-framework") or []) if "extra ==" not in r]
          assert not required, f"unconditional runtime dependencies: {required}"
          print("zero required runtime dependencies: confirmed")
          EOF

  validate:
    name: Scaffold, validate and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,all]"
      # `slowapi check` analyses every route without starting a server, which is
      # what makes a broken dependency a red build instead of a rolled-back deploy.
      - name: Every example passes route validation
        run: |
          for example in examples/*/; do
            if [ -f "$example/main.py" ]; then
              (cd "$example" && python -m slowapi check main:app)
            fi
          done
      - name: A scaffolded project passes its own tests
        run: |
          python -m slowapi new smoke-svc --template api
          cd smoke-svc && python -m pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
