name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      # Trusted publishing: no long-lived PyPI token stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/slowfw/_version.py').read_text()).group(1))")
          test "$TAG" = "$PKG" || { echo "Tag $TAG != package $PKG"; exit 1; }

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
