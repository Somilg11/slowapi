name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The single most useful thing you can include is
        a runnable snippet using `TestClient` - it turns a report into a test.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A complete script we can run without editing.
      render: python
      value: |
        from slowapi import SlowAPI
        from slowapi.testing import TestClient

        app = SlowAPI()

        @app.get("/")
        def index(res):
            res.text("hello")

        client = TestClient(app)          # try protocol="asgi" too
        print(client.get("/").status_code)
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Which protocol shows the bug?
      options: ["WSGI only", "ASGI only", "Both", "Not sure"]
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SlowAPI version
      placeholder: "0.1.0  (python -m slowapi --version)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12.4 on Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: text
